<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Formulaire de test MCP</title></head>
<body>
<h1>Formulaire de test</h1>
<form id="f" onsubmit="event.preventDefault(); document.getElementById('res').textContent = JSON.stringify({nom: f.nom.value, email: f.email.value, newsletter: f.maj.checked, cgu: f.news.checked, taille: f.taille.value});">
  <label>Nom <input type="text" name="nom"></label><br>
  <label>Email <input type="text" name="email"></label><br>
  <label><input type="checkbox" name="maj"> Je souhaite recevoir la newsletter</label><br>
  <label><input type="checkbox" name="news"> J'accepte les CGU</label><br>
  <label>Taille <select name="taille"><option value="S">S</option><option value="M">M</option><option value="L">L</option></select></label><br>
  <button type="submit">Envoyer</button>
</form>
<h2>Résultat soumis :</h2>
<pre id="res">(rien soumis)</pre>
</body>
</html>
